[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yohakuforce-context-hub"
version = "0.1.0"
description = "Context collection and storage foundation for AI projects (MCP-native)"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    {name = "koya (yohakuforce)", email = "koyablog.1104@gmail.com"},
]
keywords = [
    "mcp",
    "rag",
    "vector-search",
    "slack",
    "backlog",
    "redmine",
    "context-engineering",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # CLI
    "typer>=0.12.0",

    # Data validation
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",

    # Database (core — SQLite works out of the box)
    # The [asyncio] extra pulls in `greenlet`, required by SQLAlchemy's
    # async engine even for SQLite+aiosqlite installs.
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",

    # HTTP client (Backlog / Redmine)
    "httpx>=0.27.0",

    # Slack
    "slack-sdk>=3.27.0",

    # Scheduling — v3 API. apscheduler 4.x removed the `apscheduler.schedulers`
    # namespace and uses a redesigned API; the code base targets v3.
    "apscheduler>=3.10.0,<4.0",

    # MCP
    "mcp>=1.0.0",

    # SQLite vector search (sqlite profile / quickstart / personal)
    # sqlite-vec provides the vec0 virtual table extension.
    "sqlite-vec>=0.1.1",

    # numpy: required by the SQLite vector store and the embedding adapters
    # (core code path, not optional). Previously came in transitively through
    # FlagEmbedding, which broke vanilla installs without extras.
    "numpy>=1.26",

    # aiosqlite: async driver for SQLAlchemy when DATABASE_URL uses
    # sqlite+aiosqlite:// (default for quickstart/personal profiles).
    "aiosqlite>=0.20.0",

    # pgvector: provides the SQLAlchemy `Vector` column type used by
    # `context_hub.infrastructure.db.models`. Even SQLite-only installs
    # transitively import this module via `context_hub.api.dependencies`,
    # so pgvector must be available at import time. Pure-Python, lightweight.
    # (asyncpg stays in [postgres] extras because it requires libpq.)
    "pgvector>=0.3.0",

    # Utilities (OpenAI + Anthropic SDK intentionally excluded per 2026-05-15 policy)
    "python-dotenv>=1.0.0",
    "structlog>=23.0.0",
    "bcrypt>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/yohakuforce/context-hub"
Repository = "https://github.com/yohakuforce/context-hub"
Documentation = "https://github.com/yohakuforce/context-hub#readme"
Issues = "https://github.com/yohakuforce/context-hub/issues"

[project.scripts]
context-hub = "context_hub.cli.main:main"

[project.optional-dependencies]
# BGE-M3 local embedding — heavy (~2.3 GB model download on first use).
# Required for personal / production profiles.
# quickstart default is EMBEDDING_PROVIDER=mock (hash-based, zero install cost).
embedding = [
    "FlagEmbedding>=1.2",
    "sentence-transformers>=2.5",
]
# PostgreSQL support — installs asyncpg (requires libpq) and pgvector.
# SQLite users do not need this extra.
postgres = [
    "asyncpg>=0.29.0",
    "pgvector>=0.3.0",
]
# Local audio transcription via Whisper.
# Requires ffmpeg in PATH and pulls numba/llvmlite/CMake at build time.
audio = [
    "openai-whisper>=20231117",
    "ffmpeg-python>=0.2.0",
]
# Future: PDF / DOCX / Markdown document parsing.
# Intentionally empty in v0.1 (YAGNI — none of these modules are imported yet).
# Re-add pymupdf, python-docx, markdown-it-py here when the feature lands.
documents = []
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
    # postgres-backend tests are collected by default, so asyncpg must be
    # available in CI. pgvector moved to core deps in 0.1.0a7.
    "asyncpg>=0.29.0",
]

[tool.hatch.build.targets.wheel]
packages = ["context_hub"]
include = [
    "context_hub/**/*.py",
    "context_hub/_env_examples/.env.example.*",
    "context_hub/_sqlite_schema/*.sql",
]

[tool.hatch.build.targets.editable]
packages = ["context_hub"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=context_hub --cov-report=term-missing --cov-fail-under=80"
markers = [
    "local_postgres: requires a local Postgres instance; not run in CI by default",
]

[tool.coverage.run]
source = ["context_hub"]
omit = [
    "context_hub/infrastructure/llm/claude_adapter.py",
    "context_hub/infrastructure/llm/openai_adapter.py",
    "context_hub/infrastructure/db/access_control_repository.py",
    "context_hub/infrastructure/db/audit_log_repository.py",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN"]
ignore = ["ANN101", "ANN102"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
