[project]
name = "context-hub"
version = "0.1.0"
description = "Context collection and storage foundation for AI projects"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # Data validation
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",

    # Database
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",

    # HTTP client (Backlog / Redmine)
    "httpx>=0.27.0",

    # Slack
    "slack-sdk>=3.27.0",

    # pgvector SQLAlchemy integration
    "pgvector>=0.3.0",

    # Local embedding — BGE-M3 via FlagEmbedding
    # (FlagEmbedding and sentence-transformers are heavy; they are installed
    #  separately in Dockerfile to allow Docker layer caching)
    # Listed here for local dev completeness.
    "FlagEmbedding>=1.2.0",
    "sentence-transformers>=3.0.0",

    # httpx already listed above for Backlog/Redmine; also used by OllamaAdapter

    # Whisper (local transcription)
    "openai-whisper>=20231117",
    "ffmpeg-python>=0.2.0",

    # Document parsing
    "pymupdf>=1.24.0",
    "python-docx>=1.0.0",
    "markdown-it-py>=3.0.0",

    # Scheduling
    "apscheduler>=3.10.0",

    # MCP
    "mcp>=1.0.0",

    # SQLite vector search (sqlite profile / quickstart / personal)
    # sqlite-vec provides the vec0 virtual table extension.
    # Install the native extension wheel with: pip install sqlite-vec
    "sqlite-vec>=0.1.1",

    # Utilities (OpenAI + Anthropic SDK intentionally excluded per 2026-05-15 policy)
    "python-dotenv>=1.0.0",
    "structlog>=23.0.0",
    "bcrypt>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",  # TestClient
    "factory-boy>=3.3.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"
markers = [
    "local_postgres: requires a local Postgres instance; not run in CI by default",
]

[tool.coverage.run]
omit = [
    "src/infrastructure/llm/claude_adapter.py",
    "src/infrastructure/llm/openai_adapter.py",
    "src/mcp/server.py",
    "src/infrastructure/db/access_control_repository.py",
    "src/infrastructure/db/audit_log_repository.py",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN"]
ignore = ["ANN101", "ANN102"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
