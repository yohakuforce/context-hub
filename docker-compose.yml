version: "3.9"

# Context-Hub Docker Compose
# Windows (Docker Desktop / WSL2) and macOS compatible.
#
# Usage:
#   1. Copy .env.example to .env and fill in values
#   2. docker compose up -d
#   3. docker compose logs -f app
#
# LLM_PROVIDER options: claude-code | codex | ollama | mock
# EMBEDDING_PROVIDER:   bge-m3 | mock

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: context_hub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      # Named volume: safe on Windows Docker Desktop
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d context_hub"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${DB_PASSWORD}@db:5432/context_hub
      LLM_PROVIDER: ${LLM_PROVIDER:-claude-code}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-bge-m3}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Meeting audio files storage (stays inside the social PC, never pushed)
      - meeting_data:/app/data/meetings
      - document_data:/app/data/documents
      # BGE-M3 model cache — downloaded once, persisted across container restarts
      - bge_m3_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pg_data:
  meeting_data:
  document_data:
  bge_m3_cache:
