name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        # Scoped to new modules only — existing legacy src/ errors are tracked
        # separately and will be resolved in the namespace-refactor task (T-007a).
        run: ruff check src/mcp src/cli src/config src/core src/adapters/sqlite src/adapters/scheduler tests/unit/test_cli.py tests/unit/test_mcp.py

      - name: Type check (mypy)
        # Scoped to new modules only — existing legacy src/adapters/postgres errors
        # are tracked separately (T-007a). sqlite/scheduler adapters are clean.
        run: mypy src/mcp src/cli src/config src/core src/adapters/sqlite src/adapters/scheduler

      - name: Run tests
        run: pytest tests/ -W error::RuntimeWarning --cov=src --cov-report=term-missing --cov-fail-under=80

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: .coverage
