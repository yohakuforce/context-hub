name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check context_hub/mcp context_hub/cli context_hub/config context_hub/core context_hub/adapters/sqlite context_hub/adapters/scheduler tests/unit/test_cli.py tests/unit/test_mcp.py

      - name: Type check (mypy)
        run: mypy context_hub/mcp context_hub/cli context_hub/config context_hub/core context_hub/adapters/sqlite context_hub/adapters/scheduler

      - name: Run tests
        run: pytest tests/ -W error::RuntimeWarning --cov=context_hub --cov-report=term-missing --cov-fail-under=80

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: .coverage
